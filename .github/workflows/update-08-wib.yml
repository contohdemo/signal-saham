name: ALPHAFLOW IDX — Macro News & Signal Engine

on:
  schedule:
    - cron: '0 1 * * 1-5'
    - cron: '0 0,2-10 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode eksekusi (auto / full / news_only)'
        required: false
        default: 'auto'

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Jalankan Engine
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: node engine.js
