name: call you — STAR GROUP | Macro News & Signal Engine

on:
  schedule:
    # Jadwal Utama Sinyal Pagi (08:00 WIB = 01:00 UTC, Senin - Jumat)
    - cron: '0 1 * * 1-5'
    # Update Berita & Makro Hari Kerja (07:00 WIB & 09:00 - 00:00 WIB, Senin - Jumat)
    - cron: '0 0,2-17 * * 1-5'
    # Update Berita Akhir Pekan (09:00, 13:00, 17:00, 21:00 WIB, Sabtu - Minggu)
    - cron: '0 2,6,10,14 * * 6,0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode eksekusi (auto / full / news_only)'
        required: false
        default: 'auto'

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Jalankan Engine
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: node engine.js
